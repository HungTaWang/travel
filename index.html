<!DOCTYPE html>
<html lang="zh-TW">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>旅圖集｜我的旅行規劃總覽</title>
    <meta name="description" content="個人旅行規劃總覽：台灣、日本、韓國等地的每日行程、嚴選住宿美食與 Google Maps 導航，一頁掌握。">

    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['"Noto Sans TC"', 'sans-serif'],
                        serif: ['"Noto Serif TC"', 'serif'],
                    },
                    colors: {
                        nordic: {
                            bg: '#FAF7F2',
                            card: '#FFFFFF',
                            text: '#3C3633',
                            muted: '#938A84',
                            accent1: '#C68B7C',
                            accent2: '#8FA0A8',
                            accent3: '#D8C2AD',
                            accent4: '#9AA89B',
                            border: '#EFEAE2',
                        }
                    }
                }
            }
        }
    </script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;700&family=Noto+Serif+TC:wght@400;500;600;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="assets/css/style.css">
</head>

<body class="antialiased font-sans">

    <nav class="bg-nordic-bg/90 backdrop-blur-sm fixed w-full z-50 border-b border-nordic-border">
        <div class="max-w-6xl mx-auto px-4 sm:px-6 lg:px-8">
            <div id="nav-inner" class="flex justify-between h-16 items-center"></div>
        </div>
    </nav>

    <!-- 頁面內容由 assets/js/app.js 依路由渲染 -->
    <main id="app-view">
        <div class="min-h-screen flex items-center justify-center text-nordic-muted text-sm">
            <i class="fa-solid fa-leaf animate-pulse mr-2 text-nordic-accent1"></i>載入中…
        </div>
    </main>

    <footer class="bg-nordic-bg py-10 border-t border-nordic-border">
        <div class="max-w-4xl mx-auto px-4 text-center">
            <div class="mb-4 text-nordic-accent1"><i class="fa-solid fa-leaf"></i></div>
            <p class="text-nordic-muted text-xs font-light tracking-widest uppercase mb-2">Travel Atlas · Itinerary Planner</p>
            <p class="text-nordic-muted text-xs font-light">© 2026 旅圖集 Travel Atlas. All rights reserved.</p>
        </div>
    </footer>

    <!-- AI Chat -->
    <button id="ai-chat-toggle" aria-label="開啟 AI 旅遊顧問"
        class="fixed bottom-6 right-6 w-14 h-14 bg-nordic-accent1 text-white rounded-full shadow-lg flex items-center justify-center hover:bg-opacity-90 hover:scale-105 z-40 focus:outline-none">
        <i class="fa-solid fa-wand-magic-sparkles text-xl"></i>
    </button>

    <div id="ai-chat-widget"
        class="fixed bottom-24 right-4 sm:right-6 w-[calc(100vw-2rem)] sm:w-96 bg-white rounded-2xl shadow-2xl border border-nordic-border z-50 flex flex-col overflow-hidden h-[500px] max-h-[70vh]">
        <div class="bg-nordic-bg px-4 py-3 border-b border-nordic-border flex justify-between items-center">
            <div class="flex items-center gap-2">
                <div class="w-8 h-8 rounded-full bg-white border border-nordic-border flex items-center justify-center">
                    <i class="fa-solid fa-robot text-nordic-accent1 text-sm"></i>
                </div>
                <div>
                    <div id="ai-chat-name" class="font-serif font-medium text-nordic-text text-sm">旅遊顧問 AI</div>
                    <div class="text-[10px] text-nordic-accent1 flex items-center gap-1"><span
                            class="w-1.5 h-1.5 rounded-full bg-nordic-accent1 inline-block"></span> 上線中</div>
                </div>
            </div>
            <button id="ai-chat-close" aria-label="關閉"
                class="text-nordic-muted hover:text-nordic-text focus:outline-none transition-colors">
                <i class="fa-solid fa-chevron-down"></i>
            </button>
        </div>

        <div id="ai-chat-messages" class="flex-1 overflow-y-auto p-4 space-y-4 bg-white font-sans text-sm"></div>

        <div class="p-3 border-t border-nordic-border bg-nordic-bg flex gap-2 items-end">
            <textarea id="ai-chat-input" rows="1" placeholder="輸入您的問題..."
                class="flex-1 px-3 py-2.5 rounded-lg border border-nordic-border focus:outline-none focus:border-nordic-accent1 text-sm bg-white resize-none no-scrollbar overflow-hidden"
                style="min-height: 42px; max-height: 100px;"></textarea>
            <button id="ai-chat-send" aria-label="送出"
                class="bg-nordic-text text-white w-10 h-10 rounded-lg hover:bg-nordic-accent1 transition-colors focus:outline-none flex items-center justify-center flex-shrink-0">
                <i class="fa-solid fa-paper-plane text-sm translate-x-[-1px] translate-y-[1px]"></i>
            </button>
        </div>
    </div>

    <!-- 1) 全站目錄（地區 & 行程清單） 2) AI 對話 3) 路由與渲染（會自動載入 trips/*.js） -->
    <script src="assets/js/catalog.js"></script>
    <script src="assets/js/chat.js"></script>
    <script src="assets/js/app.js"></script>
</body>

</html>
